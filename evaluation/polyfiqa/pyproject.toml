[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aida-polyfiqa-eval"
version = "0.1.0"
description = "Reproducible oracle-context evaluation harness for AIDA and PolyFiQA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
data = [
  "datasets>=3.6,<5",
]
metrics = [
  "bert-score>=0.3.13,<1",
  "evaluate>=0.4.3,<1",
  "nltk>=3.9,<3.10",
  "rouge-score>=0.1.2,<1",
]
all = [
  "datasets>=3.6,<5",
  "bert-score>=0.3.13,<1",
  "evaluate>=0.4.3,<1",
  "nltk>=3.9,<3.10",
  "rouge-score>=0.1.2,<1",
]

[project.scripts]
polyfiqa-eval = "polyfiqa_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["polyfiqa_eval*"]
